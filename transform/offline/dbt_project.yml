  accepted_periods: ['2023-02-01', '2023-03-01', '2023-04-01', '2023-05-01', '2024-01-01', '2024-02-01', '2024-03-01', '2024-04-01', '2024-05-01']
  m3_to_bbl: 6.28981077
seeds:
  vaca_muerta_pulse:
    operator_groups:
      +column_types:
        valid_from: date
        valid_to: date
    synthetic_well_month:
      +column_types:
        periodo: date
        source_batched_at: timestamp

    synthetic_well_geo:
      +column_types:
        longitude: double
        latitude: double
        coordinate_valid: boolean
        catalog_at: timestamp
