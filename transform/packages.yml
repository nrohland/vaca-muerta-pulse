# Hub-only, free packages. `dbt deps` installs these into dbt_packages/ (gitignored).
# Pin ranges, not floating latest, so contributors and CI resolve the same minors.
packages:
  - package: dbt-labs/dbt_utils
    version: [">=1.3.0", "<2.0.0"]
  - package: metaplane/dbt_expectations
    version: [">=0.10.8", "<0.11.0"]
  - package: dbt-labs/codegen
    version: [">=0.13.0", "<0.15.0"]
  - package: godatadriven/dbt_date
    version: [">=0.9.0", "<1.0.0"]
  # Hub name for dbt-event-logging. fishtown-analytics/dbt-event-logging 0.1.x (2018)
  # does not parse on dbt 1.8+ (`data-paths`). Current package: dbt-labs/logging.
  # Hooks that CREATE audit tables in BQ are OFF by default (cost).
  - package: dbt-labs/logging
    version: [">=0.8.0", "<0.9.0"]
  # There is no Hub package named "dbt-doctor" (that name is an npm CLI).
  # Mixing npm into this Python dbt project is out of scope. Hub-free project
  # health: dbt_project_evaluator — models/seeds DISABLED by default so
  # `dbt build` does not scan extra BQ. See transform/README.md.
  - package: dbt-labs/dbt_project_evaluator
    version: [">=1.0.0", "<2.0.0"]
