version: 2

models:
  - name: dim_area
    description: >
      Grain: one row per idareapermisoconcesion. Display name areapermisoconcesion comes from the latest
      observed well-month, with deterministic lexical tie-break. Historical
      renames are allowed; the singular identity test rejects conflicting names
      for one ID in the same month. name_periodo and historical_name_count
      preserve traceability. This legacy dimension includes all observed months;
      publication marts separately restrict names to accepted snapshots.
      Cross-year ID stability still needs external evidence. No constant-portfolio
      reconstruction is implied.
    columns:
      - name: idareapermisoconcesion
        description: Permiso/concesión area id. Primary key.
        data_tests:
          - unique
          - not_null
      - name: areapermisoconcesion
        description: Area display name for the Pulse cut.
        data_tests:
          - not_null
      - name: well_count
        description: Distinct `idpozo` across all months in this dim.
      - name: company_count
        description: Distinct `idempresa` that produced in this area (any month).
      - name: first_periodo
        description: Earliest Cap. IV month this area appears in well-month.
      - name: last_periodo
        description: Latest Cap. IV month this area appears in well-month.
      - name: name_periodo
        description: Month of latest observed display name.
      - name: historical_name_count
        description: Number of observed distinct names for the stable source ID.
