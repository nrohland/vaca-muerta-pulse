version: 2
models:
  - name: fct_production_month
    description: 'Approved complete snapshot totals. Grain: fluid (oil/gas) × periodo. Monthly volume in bbl or million_m3; rate per calendar day. Percentages use 0–100 scale. Missing calendar comparator or zero base yields null percentage.'
    columns:
      - name: periodo
        data_tests: [not_null]
      - name: fluid
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [oil, gas]
  - name: fct_entity_growth
    description: 'Grain: fluid × dimension (company/area) × entity_id × periodo. Complete snapshot union of current, exact YoY and MoM entities includes exits; absent entity zero only in explicitly accepted snapshot. Latest accepted name plus name_periodo and source_name preserve renames. Company entity_id is the reviewed presentation group (PCN/PLU = PLUSPETROL from 2023-01), other IDs remain legal IDs. No acquired-vendor restatement. legal_operator_provenance preserves every original declared ID/name in each current snapshot; source_name remains an observed legal name and entity_name is Pluspetrol for the mapped group.'
    columns:
      - name: entity_id
        data_tests: [not_null]
      - name: dimension
        data_tests:
          - accepted_values:
              arguments:
                values: [company, area]
      - name: operator_group_rule_version
        description: 'Explicit mapping version for a mapped company in the current snapshot; null for identity mapping, areas and absent-current rows.'
      - name: legal_operator_provenance
        description: 'Array of structs {idempresa, empresa} preserving declared legal operators behind each current company aggregate. Null for area and absent-current rows. Inspect this field instead of treating source_name as the complete group membership.'
