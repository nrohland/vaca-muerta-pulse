  package: perforacion-de-pozos-de-petroleo-y-gas
  package_id: 7ea2ac77-d7a0-4129-9fbf-6f1a25d94e21
  portal: https://datos.energia.gob.ar/dataset/perforacion-de-pozos-de-petroleo-y-gas
