  suie_index: https://www.argentina.gob.ar/economia/energia/planeamiento-energetico/sistema-unificado-de-informacion-energetica/exploracion-y-0
  periodicity: R/P1M
  pozos_en_perforacion:
    resource_id: af6838ef-f675-4409-ac6a-e7c391a5dbab
    datastore_total_2026_09_11: 477446
    fields:
      - anio
      - mes
      - empresa
      - idempresa
      - cuenca
      - provincia
      - areapermisoconcesion
      - concepto
      - cantidad
    grain: company × area × concept × month; cantidad = wells in drilling that month
    notes: Proxy of drilling activity. NOT Baker Hughes / NCS / IAPG live rigs.

